function fit(c) { const r = c.getBoundingClientRect(), d = devicePixelRatio || 1; c.width = Math.max(1, Math.round(r.width * d)); c.height = Math.max(1, Math.round(r.height * d));

  g.font = "600 12px Inter"; const tw = g.measureText(label).width; g.fillStyle = "rgba(255,255,255,.9)"; g.fillRect(x + 4, ly - 12, tw + 6, 16);
  g.fillStyle = col; g.fillText(label, x + 7, ly); }
function draw() {
  if (img.getAttribute("src") !== ex.image) { img.onload = draw; img.src = ex.image; return; }
  document.getElementById("no").textContent = step + 1; document.getElementById("h").textContent = STEPS[step][0]; document.getElementById("p").textContent = STEPS[step][1];
  [...dots.children].forEach((d, i) => d.classList.toggle("on", i === step));
  document.getElementById("back").disabled = step === 0; document.getElementById("next").disabled = step === STEPS.length - 1;
  const [g, w, h] = fit(ov), [q, dw, dh] = fit(det); g.clearRect(0, 0, w, h); q.clearRect(0, 0, dw, dh);
  const fast = css("--fast"), slow = css("--slow"), ink = css("--ink"), ink2 = css("--ink2"), ink3 = css("--ink3"), acc = css("--accent");
  const box = () => { g.setLineDash([5, 4]); g.strokeStyle = css("--gt"); g.lineWidth = 1.5; g.strokeRect(b[0] * w, b[1] * h, (b[2] - b[0]) * w, (b[3] - b[1]) * h); g.setLineDash([]); };
  if (step === 0) {
    for (let i = 0; i <= N; i++) { g.strokeStyle = i % 32 === 0 ? "rgba(255,90,20,.85)" : "rgba(26,17,13,.16)"; g.lineWidth = i % 32 === 0 ? 1.5 : 1;
      g.beginPath(); g.moveTo(i / N * w, 0); g.lineTo(i / N * w, h); g.stroke(); }
    q.fillStyle = ink2; q.font = "12px Inter";
    for (let i = 0; i <= N; i += 32) { q.textAlign = i === 0 ? "left" : i === N ? "right" : "center"; q.fillStyle = fast; q.font = "600 12px JetBrains Mono"; q.fillText(i === N ? 255 : i, i / N * dw, 18); }
    q.textAlign = "left"; q.fillStyle = ink2; q.font = "13px Inter"; q.fillText("column index (every 32nd line in orange)", 0, 44);
  }
  if (step === 1) {
    for (let i = 0; i <= N; i++) { g.strokeStyle = "rgba(26,17,13,.12)"; g.beginPath(); g.moveTo(i / N * w, 0); g.lineTo(i / N * w, h); g.stroke(); }
    const groups = [[0, 10], [80, 92], [244, 256]], gw = (dw - 40) / 3;
    groups.forEach(([a, z], gi) => { const x0 = gi * (gw + 20), cw = gw / (z - a);
      for (let k = a; k < z; k++) { const x = x0 + (k - a) * cw; q.fillStyle = css("--fast-soft"); q.strokeStyle = "rgba(255,90,20,.35)";
        q.fillRect(x + 1, 30, cw - 2, 40); q.strokeRect(x + 1, 30, cw - 2, 40);
        q.fillStyle = "#c2410c"; q.font = "600 13px JetBrains Mono"; q.textAlign = "center"; q.fillText(D.labels_E[k].trim() || "␣", x + cw / 2, 56);
        q.fillStyle = ink3; q.font = "10px JetBrains Mono"; q.fillText(k, x + cw / 2, 86); }
      q.textAlign = "left"; q.fillStyle = ink2; q.font = "12px Inter"; q.fillText(gi === 0 ? "columns 0–9" : gi === 1 ? "columns 80–91: where characters end" : "columns 244–255", x0, 20); });
    q.fillText("one token per column · each is a single token after “x:” in the prompt", 0, 120);

    const gw = (dw - 30) / 2, panel = (x0, title, f, col) => { const cw = gw / (hi - lo);
      for (let k = lo; k < hi; k++) { const t = f(k); q.fillStyle = col; q.fillRect(x0 + (k - lo) * cw + .5, 120 - t * 90, cw - 1, t * 90); }
      q.fillStyle = css("--gt"); q.fillRect(x0 + (b[0] * N - lo) * cw, 124, (b[2] - b[0]) * N * cw, 4);

      g.strokeStyle = "rgba(26,17,13,.25)"; g.beginPath(); g.moveTo(i / 10 * w, 0); g.lineTo(i / 10 * w, h); g.stroke(); });
    box(); marker(g, A.read[0] * w, h, slow, `F (xc + x): ${A.read[0].toFixed(3)}`, false, 16); marker(g, read * w, h, fast, `E (one slot): ${read.toFixed(3)}`, true, 36);
    const row = (y0, p, col, label) => { const mx = Math.max(...p), bw = dw / p.length;
      p.forEach((v, i) => { const t = v / mx; q.fillStyle = col; q.fillRect(i * bw + (p.length === 10 ? 3 : 0), y0 + 34 - t * 32, Math.max(bw - (p.length === 10 ? 6 : .3), .6), t * 32); });
      q.fillStyle = ink2; q.font = "11.5px Inter"; q.textAlign = "left"; q.fillText(label, 0, y0 + 46); };
    row(0, A.pxc, acc, "F · xc: 10 coarse columns (shaded on the screenshot)");
    row(56, A.px, slow, "F · x: 256 fine columns, multiplied by the xc of each column's tenth");
    row(112, ex.E.px, fast, "E · x: 256 columns, one slot, no coarse step");
  }
  document.getElementById("cap").textContent = (D.synthetic === "partial"
      ? "The screenshot, the 256 label tokens and E3's read point are real (step 5 of a recorded Wikipedia task); the bar shapes, and F's reads in step 5, are illustrative. "
      : D.synthetic ? "Placeholder distributions until the real reads are captured. " : "Real reads: Gemma 4 31B with the E3 (one slot) and F (coarse + fine) adapters. ") +
    "Step: " + ex.instruction + ".";
}
document.getElementById("back").onclick = () => { step = Math.max(0, step - 1); draw(); };
document.getElementById("next").onclick = () => { step = Math.min(STEPS.length - 1, step + 1); draw(); };
addEventListener("resize", draw); draw();
</script></body></html>
